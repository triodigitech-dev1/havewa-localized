# Localea Rental Management — Production (VPS/Server). Start: docker compose -f docker-compose.prod.yml up -d --build
# Requires a .env file alongside it.
services:
  app:
    build: .
    container_name: localea-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://localea:${DB_PASSWORD}@db:5432/localea?schema=public"
      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_TRUST_HOST: "true"
      # Optional bootstrap on first start:
      SEED_DEMO: "${SEED_DEMO:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_NAME: "${ADMIN_NAME:-}"
      TENANT_NAME: "${TENANT_NAME:-Localea Rental Management}"
      # Optional OIDC/SSO:
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_NAME: "${OIDC_NAME:-}"
    expose:
      - "3000"
    volumes:
      - localea-storage:/app/storage

  caddy:
    image: caddy:2-alpine
    container_name: localea-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  db:
    image: postgres:16-alpine
    container_name: localea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: localea
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: localea
    volumes:
      - localea-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localea-db:
  localea-storage:
  caddy-data:
  caddy-config:
