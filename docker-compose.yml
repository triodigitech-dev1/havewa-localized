services:
  db:
    image: postgres:16-alpine
    container_name: localea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: localea
      POSTGRES_PASSWORD: localea_password
      POSTGRES_DB: localea
    ports:
      - "5432:5432"
    volumes:
      - localea-db:/var/lib/postgresql/data

volumes:
  localea-db:
